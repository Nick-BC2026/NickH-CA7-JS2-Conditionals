<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nicholas Aaron Hewitt">
    <title>Bear Ninja Hunter</title>
</head>
<body>
    <div id="game-output">Waiting for player...</div>

    <script>
        // Inputs
        let gamerName = prompt("Welcome to Bear Hunter Ninja! Please enter your name to get started:");
        alert("Hi " + gamerName + " Let's Play!!");
        let gamerChoice = prompt("Who are you: Bear, Ninja, or Hunter?");

        // Settings
        const cpuChoice = "Bear";
        let winnerText = "";

        // Logic
        switch (gamerChoice) {
            case "Bear":
                if (cpuChoice === "Bear") {
                    winnerText = "Tie!";
                } else if (cpuChoice === "Ninja") {
                    winnerText = "You Win!!";
                } else {
                    winnerText = "The Computer Wins!";
                }
                break;

            case "Ninja":
                if (cpuChoice === "Bear") {
                    winnerText = "The Computer Wins!";
                } else if (cpuChoice === "Ninja") {
                    winnerText = "Tie!";
                } else {
                    winnerText = "You Win!!";
                }
                break;

            case "Hunter":
                if (cpuChoice === "Bear") {
                    winnerText = "You Win!!";
                } else if (cpuChoice === "Ninja") {
                    winnerText = "The Computer Wins!";
                } else {
                    winnerText = "Tie!";
                }
                break;

            default:
                winnerText = "Invalid game state.";
                break;
        }

        // Output
        let htmlOutput = `${gamerName} you chose ${gamerChoice}!<br><br>The computer chose ${cpuChoice}!<br><br>${winnerText}`;
        let consoleOutput = `${gamerName} you chose ${gamerChoice}!\nThe computer chose ${cpuChoice}!\n${winnerText}`;

        document.getElementById("game-output").innerHTML = htmlOutput;
        console.log(consoleOutput);
    </script>
</body>
</html>
